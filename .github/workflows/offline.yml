name: Standalone offline game
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build one-file offline game
        run: npm run build:offline
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Verify offline launch, movement and jump
        run: node tests/v3-offline.mjs
      - name: Publish validated offline HTML
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rat-game-offline-html
          path: preview/Rat Game V3.html
          if-no-files-found: error
          retention-days: 30
