name: Mobile live play smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-live.yml'
      - 'tests/mobile-live.mjs'

permissions:
  contents: read

jobs:
  play-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tooling
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test actual live game with touch controls
        run: node tests/mobile-live.mjs
      - name: Save screenshots and frame-time report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rat-game-mobile-playtest
          path: test-results/
