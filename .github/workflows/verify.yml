name: Kitchen playtest
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  play:
    runs-on: ubuntu-24.04 # Playwright 1.58 browser dependencies are not supported on Ubuntu 26.04 yet
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      # Chromium is installed on Ubuntu; WebKit runs on macOS below because
      # Ubuntu's WebKit system libraries are missing on this runner image.
      - name: Install Playwright Chromium
        run: npx playwright install chromium
        timeout-minutes: 4
      - name: Start the local preview
        run: |
          npm run preview -- --port 4318 --strictPort > /tmp/rat-preview.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4318/ > /dev/null && exit 0; sleep 1; done
          cat /tmp/rat-preview.log
          exit 1
      # Standalone file:// preview is tracked separately in Issue #13;
      # never let an unrelated offline bundling failure block hosted gameplay.
      - name: Check scrolling camera, resize debouncing and low-GPU fallback
        run: node tests/v3-mobile-fluid.mjs
      - name: Verify both original PDF drawings in gameplay and gallery
        run: node tests/v3-original-art.mjs
      - name: Check instant Chaos launch and classic story on desktop/iPhone
        run: node tests/v3-chaos-start.mjs
      - name: Verify new mischief features on a mobile layout
        run: npm run test:features
      - name: Verify touch-target sizes before full kitchen playthrough
        run: npm run test:layout
      - name: Play the kitchen with keyboard and touch
        run: npm run test:game
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kitchen-playtest
          path: |
            .playtest/*.json
            .playtest/*.png
          include-hidden-files: true

  safari:
    name: iPhone-like WebKit layout (macOS)
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install native WebKit engine
        run: npx playwright install webkit
      - name: Start local preview
        run: |
          npm run preview -- --port 4318 --strictPort > /tmp/rat-preview-webkit.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4318/ > /dev/null && exit 0; sleep 1; done
          cat /tmp/rat-preview-webkit.log
          exit 1
      - name: Test Safari-like touch and rotation
        run: node tests/v3-webkit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safari-touch-playtest
          path: .playtest/webkit.json
