name: Vertical Slice — build and mobile playtest
on:
  push:
    branches: [vertical-slice]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Compile the game for production
        run: npm run build
      - name: Install Chromium and Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Start local preview server
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/rat-game-vs.log 2>&1 &
          for i in {1..60}; do curl -fsS http://127.0.0.1:5173/ >/dev/null && break || sleep 1; done
      - name: Test gameplay on touch and keyboard
        run: node tests/vertical-slice-playtest.mjs
      - name: Save screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vertical-slice-test-report
          path: test-results/vertical-slice/
